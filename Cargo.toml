[package]
name = "mame_launcher"
version = "0.5.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chd = "0.4.0"
crossbeam-channel = "0.5.17"
digest = "0.10.7"
fatfs = "0.3.6"
hex = "0.4.3"
mbrman = "0.6.1"
md-5 = "0.10.6"
native-dialog = "0.9.7"
once_cell = "1.21.4"
open = "5.4.5"
packbytes = "0.2.0"
portpicker = "0.1.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.3"
rand_core = "0.6.4"
regex = "1.13.1"
rodio = "0.23.0"
rsa = { version = "0.9.10" }
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10.1"
sha1 = { version = "0.10.7", features = ["oid"] }
slint = { version = "1.18.1", features = ["unstable-winit-030"] } # unstable-winit-030 is used for the external dropdown window (see externalpopup.rs)
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-pause-synack", "auto-icmp-echo-reply"] }
strum = "0.28.0"
strum_macros = "0.28.0"
sysinfo = "0.40.1"
toml = "1.1.8"
which = "8.0.6"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libxdo-sys = "0.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = "0.3.9"
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25", features = ["elcapitan"] }
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
foreign-types-shared = "0.3.1"
accessibility-sys = "0.2.0"

[package.metadata.bundle]
name = "WebTV MAME Launcher"
identifier = "pm.emac.mame_launcher"
icon = ["ui/images/icon.png"]
copyright = "Unlicensed"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"
